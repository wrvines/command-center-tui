# One box at a time: CPU, memory/disks, network, processes.
# p / Shift+p cycles presets. Full view remains available with ordinary btop.
color_theme = "command-center"
theme_background = false
truecolor = true
update_ms = 2000
shown_boxes = "cpu"
presets = "cpu:0:block mem:0:block net:0:block proc:0:block"
disable_presets = "Default"
cpu_single_graph = true
mem_graphs = false
proc_cpu_graphs = false
graph_symbol = "block"
rounded_corners = true
terminal_sync = true
